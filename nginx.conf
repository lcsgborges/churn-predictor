# Reverse proxy: 1 porta pública (7860) serve produto E API.
#   /       -> Streamlit (interno :8501)   [produto]
#   /api/*  -> FastAPI  (interno :8000)     [API pública: /api/predict, /api/health, /api/docs]
# Escrito para rodar como usuário não-root: pid e arquivos temporários em /tmp.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/nginx_client;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;
    scgi_temp_path        /tmp/nginx_scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 7860;
        server_name _;

        # --- API pública (remove o prefixo /api) ---
        location /api/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # --- WebSocket do Streamlit ---
        location /_stcore/ {
            proxy_pass http://127.0.0.1:8501/_stcore/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # --- Produto (Streamlit) em tudo o mais ---
        location / {
            proxy_pass http://127.0.0.1:8501/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 120s;
        }
    }
}
