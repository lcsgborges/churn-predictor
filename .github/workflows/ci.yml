name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

# Todo o projeto vive na pasta de submissão.
defaults:
  run:
    working-directory: 1-1_lucas_guimaraes

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 1-1_lucas_guimaraes/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Treinar modelo
        run: python -m ml.train

      - name: Testes (pytest)
        env:
          OPENAI_API_KEY: ""
        run: pytest -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar MkDocs
        run: pip install -r requirements-docs.txt
      - name: Build da doc (valida links/nav)
        run: mkdocs build --strict

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem Docker
        run: docker build -t churn-agent:ci .
        working-directory: 1-1_lucas_guimaraes
